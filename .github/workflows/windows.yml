# Builds the Windows app on every push; on a vX.Y.Z tag, attaches the installer to that GitHub release
# (the in-app updater looks for an asset ending in -setup.exe on the latest release).
name: Windows

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y
      - name: Build
        shell: pwsh
        run: |
          $version = if ("${{ github.ref_type }}" -eq "tag") { "${{ github.ref_name }}".TrimStart("v") } else { "" }
          ./build.ps1 -Version $version
      - uses: actions/upload-artifact@v4
        with:
          name: OllieBoard-windows
          path: build/*-setup.exe
      - name: Attach to release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          gh release view "${{ github.ref_name }}" *> $null
          if ($LASTEXITCODE -ne 0) { gh release create "${{ github.ref_name }}" --title "OllieBoard ${{ github.ref_name }}" --notes "" }
          gh release upload "${{ github.ref_name }}" (Get-ChildItem build/*-setup.exe).FullName --clobber
